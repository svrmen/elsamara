<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ЭлектроСмета — Станислав</title>
<!-- Библиотека для чтения xls/xlsx (работает при наличии интернета) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f9fc;--card:#ffffff;--muted:#606979;--ink:#0f172a;--accent:#2563eb;
  --danger:#dc2626;--line:#e6e9ef;--chip:#eef2ff
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.46 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.formPairs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}
.fieldLabel{font-size:13px;font-weight:600;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.toolbarPrimary{display:flex;gap:10px;flex-wrap:wrap}
.toolButton{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid #d8deeb;background:#f8f9fc;color:var(--ink);font-weight:600;font-size:14px;min-height:44px}
.toolButton .icon{font-size:18px}
.toolButton.primary{background:var(--accent);color:#fff;border-color:transparent}
.toolButton.ghost{background:#fff}
.toolButton.danger{color:#b91c1c;border-color:#f4c7c7;background:#fff}
.toolMenu{position:relative}
.toolMenu summary{list-style:none;display:flex;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid #d8deeb;cursor:pointer;min-height:44px;font-weight:600}
.toolMenu summary::-webkit-details-marker{display:none}
.toolMenu[open] summary{background:#eef2ff}
.menuSheet{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #d8deeb;border-radius:14px;box-shadow:0 14px 36px rgba(15,23,42,.15);padding:8px;display:grid;gap:6px;min-width:220px;z-index:20}
.menuSheet button{justify-content:flex-start}
.qtyControl{display:flex;align-items:center;border:1px solid #d6dbe6;border-radius:12px;overflow:hidden;min-height:44px}
.qtyControl input{border:none;min-height:44px;text-align:center;font-weight:600;font-size:16px;width:72px;padding:0 6px}
.qtyBtn{width:48px;min-height:44px;border:none;background:#f1f4fa;color:var(--ink);font-size:20px;line-height:1;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qtyBtn:active{background:#e2e8f6}
.sumCell{font-weight:700;font-size:15px}
.itemCardToggle{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;display:none;align-items:center;gap:6px;padding:0;margin-top:8px;cursor:pointer}
.itemCardToggle .toggleIcon{font-size:12px;transition:transform .2s ease}
.itemCard.expanded .itemCardToggle .toggleIcon{transform:rotate(180deg)}
.totalsBar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid rgba(15,23,42,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 -12px 32px rgba(15,23,42,.12);transform:translateY(120%);transition:transform .3s ease}
.totalsBar.show{display:flex;transform:translateY(0)}
.totalsBarTotal{display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:16px}
.totalsBarTotal span{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.totalsBarActions{display:flex;gap:10px}
.totalsBarActions .toolButton{min-width:120px;justify-content:center;flex:1 1 auto}
.stickySearch{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#fff,#fff 85%,rgba(255,255,255,0));padding-bottom:8px}
.chipRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:-4px -2px 0;padding-inline:2px}
.chipRow::-webkit-scrollbar{display:none}
.chipRow .chip{white-space:nowrap;flex-shrink:0}
@media screen and (min-width: 741px){
  .totalsBar{display:none !important}
}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:16px;margin:0 0 8px;color:var(--muted)}
input,select,textarea{background:#fff;border:1px solid #d6dbe6;color:var(--ink);border-radius:10px;padding:10px;outline:none;width:100%}
button{background:#fff;border:1px solid #cfd6e3;color:#0f172a;border-radius:10px;padding:8px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
button.ghost{background:#fff;border-color:#d1d5db}
button.danger{background:#fff;border-color:#f4c7c7;color:#b91c1c}
.btn-sm{padding:6px 8px;border-radius:8px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.actionsRow{gap:8px;flex-wrap:wrap}
.contactGrid{gap:6px;min-width:260px}
.grow{flex:1}
.muted{color:var(--muted)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;background:var(--chip);border:1px solid #dbe3ff;border-radius:999px;font-weight:600;cursor:pointer}
.chip.is-active{background:var(--accent);color:#fff;border-color:transparent}
.avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,#dbeafe,#ede9fe);border:1px solid #c7d2fe;color:#1e293b}
.divider{height:1px;background:var(--line);margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
.right{text-align:right}
input.right{ text-align:right }
.pill{font-size:12px;border:1px solid #cfd6e3;padding:2px 8px;border-radius:999px;color:var(--muted);background:#fff}

/* Модалка */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.backdrop.show{display:flex}
.modal{background:#fff;border-radius:16px;border:1px solid #d9e1ef;max-width:980px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modalHeader{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #eef2f8}
.modalBody{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}
.modalFooter{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid #eef2f8;background:#fafcff}
.x{border:none;background:transparent;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
#catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.catCard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:6px;grid-template-columns:auto 1fr;align-items:center}
.catIcon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#f2f6ff;border-radius:10px}
.list{height:48vh;overflow:auto;border:1px dashed #d7deea;border-radius:12px;padding:2px;background:#fff}
#catChips,#catChipsInline{display:none}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px}
.item:hover{background:#f3f6fb}
.priceEdit{width:88px}
.note{min-height:74px}
a.tel{color:inherit;text-decoration:none}
#items .unitCell{width:90px}
#items .typeCell{width:120px}
#items .priceCell{width:140px}
#items .qtyCell{width:120px}
#items .actionsCell{width:40px}
#items .moreCol,#items .moreCell{display:none}

/* Итоги */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.line{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.line:last-child{border-bottom:none}

/* === MOBILE PATCH === */
@media screen and (max-width: 740px){
  body{font-size:15px;padding-bottom:140px}
  .wrap{padding:12px;padding-bottom:calc(140px + env(safe-area-inset-bottom))}
  .grid{gap:10px}
  h1{font-size:20px}
  .card{padding:12px}
  .formPairs{gap:10px}
  .toolbar{gap:8px}
  .toolbarPrimary{width:100%;gap:8px}
  .toolButton{flex:1 1 48%;justify-content:center}
  .toolButton .icon{font-size:17px}
  input,select,textarea,button{min-height:44px;font-size:16px}
  button.btn-sm{min-height:40px}
  input[type="checkbox"]{width:20px;height:20px}
  #items{border-spacing:0}
  #items thead{display:none}
  #items tbody{display:grid;gap:12px}
  #items tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;position:relative}
  #items tbody tr > td{border:none;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
  #items tbody tr > td::before{content:attr(data-label);font-size:12px;font-weight:600;color:var(--muted)}
  #items tbody tr > td[data-label=""]::before{content:'';display:none}
  #items tbody tr > td.cell-full{grid-column:1/-1}
  #items tbody tr .idxCell{order:1;font-size:18px;font-weight:700}
  #items tbody tr .nameCell{order:2;grid-column:1/-1}
  #items tbody tr .typeCell{order:3}
  #items tbody tr .priceCell{order:4}
  #items tbody tr .qtyCell{order:5}
  #items tbody tr .sumCell{order:6;align-items:flex-end}
  #items tbody tr .actionsCell{order:7;align-items:flex-end;justify-content:flex-end}
  #items tbody tr .actionsCell button{width:44px;min-height:44px;border-radius:12px;font-size:22px;line-height:1}
  #items tbody tr .unitCell{order:8;display:none;grid-column:1/-1}
  #items tbody tr .moreCell{order:9;grid-column:1/-1}
    #items tbody tr.expanded .unitCell{display:flex}
  .itemCardToggle{display:flex}
  .qtyControl{width:100%}
  .qtyControl input{width:100%}
  .totalsBar{display:flex}
  .modal{width:100%;max-width:none;height:100vh;max-height:100vh;border-radius:0}
  .modalBody{padding:12px;display:flex;flex-direction:column;gap:12px}
  #catRow,#pickRow{display:flex;flex-direction:column;gap:12px;height:100%}
  .stickySearch{padding:12px 12px 8px;margin:-12px -12px 0 -12px}
  #catGrid{display:none}
  #catChips,#catChipsInline{display:flex}
  #catChipsInline{margin-top:8px}
  .list{flex:1;min-height:0;max-height:none}
  .item{grid-template-columns:24px 1fr auto}
  .priceEdit{width:86px}
  .totals{grid-template-columns:1fr}
}
@media screen and (max-width: 430px){
  body{font-size:14px}
  h1{font-size:18px}
  .card{padding:10px}
  .formPairs{gap:8px}
  .toolButton{padding:8px 10px;font-size:13px}
  .toolButton .icon{font-size:16px}
  .toolbarPrimary{flex-direction:column;align-items:stretch}
  .toolButton{flex:1 1 auto}
  .qtyBtn{width:44px;min-height:44px}
}
@media screen and (max-width: 359px){
  .formPairs{grid-template-columns:1fr}
  .toolbarPrimary{flex-direction:column}
}
@media print{
  .totalsBar{display:none !important}
}
</style>
</head>
<body>
<div class="wrap grid" id="app">
  <!-- Шапка -->
  <div class="card">
    <div class="row wrap stack-sm" style="align-items:center">
      <div class="row grow">
        <div class="avatar">С</div>
        <div>
          <h1>ЭлектроСмета — Станислав</h1>
          <div class="muted">Быстрый расчёт на объекте • офлайн</div>
        </div>
      </div>
      <div class="grid contactGrid">
        <div class="chip">📞 <a class="tel" id="proPhoneLink" href="tel:+79198094588">+7 919 809 45 88</a></div>
        <div class="chip">👤 <span id="proNameView">Станислав</span></div>
      </div>
    </div>
  </div>

  <!-- Реквизиты -->
  <div class="card grid">
    <h2>Данные клиента и исполнителя</h2>
    <div class="formPairs">
      <label class="field">
        <span class="fieldLabel">Клиент</span>
        <input id="client" placeholder="ФИО или организация" />
      </label>
      <label class="field">
        <span class="fieldLabel">Телефон</span>
        <input id="clientPhone" placeholder="Телефон клиента" inputmode="tel" />
      </label>
      <label class="field">
        <span class="fieldLabel">Адрес / объект</span>
        <input id="site" placeholder="Адрес / объект" />
      </label>
      <label class="field">
        <span class="fieldLabel">Дата</span>
        <input id="date" type="date" />
      </label>
      <label class="field">
        <span class="fieldLabel">№ сметы</span>
        <input id="estimateNo" placeholder="№ сметы (необязательно)" />
      </label>
      <label class="field">
        <span class="fieldLabel">Срок действия, дней</span>
        <input id="validDays" type="number" inputmode="decimal" min="0" step="1" placeholder="Например 7" />
      </label>
    </div>
    <div class="formPairs" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <label class="field" style="max-width:200px">
        <span class="fieldLabel">Валюта</span>
        <input id="currency" placeholder="Валюта" value="₽" />
      </label>
    </div>
    <div class="divider"></div>
    <div class="formPairs">
      <label class="field">
        <span class="fieldLabel">Исполнитель — имя</span>
        <input id="proName" value="Станислав" placeholder="Исполнитель — имя" />
      </label>
      <label class="field">
        <span class="fieldLabel">Исполнитель — телефон</span>
        <input id="proPhone" value="+7 919 809 45 88" placeholder="Исполнитель — телефон" inputmode="tel" />
      </label>
    </div>
  </div>

  <!-- Таблица позиций -->
  <div class="card grid">
    <div class="row" style="gap:10px;align-items:center;flex-wrap:wrap">
      <h2 class="grow">Позиции сметы</h2>
      <button id="addRow" class="toolButton primary"><span class="icon">＋</span><span>Позиция</span></button>
      <button id="btnTKP" class="toolButton ghost"><span class="icon">📄</span><span>ТКП / PDF</span></button>
    </div>
    <div class="toolbar">
      <div class="toolbarPrimary">
        <button id="importMaterials" class="toolButton ghost"><span class="icon">📥</span><span>Импорт XLS</span></button>
        <button id="exportPrice" class="toolButton ghost"><span class="icon">📤</span><span>Экспорт</span></button>
        <button id="btnPrintAll" class="toolButton ghost"><span class="icon">🖨️</span><span>Печать</span></button>
        <button id="openPrice" class="toolButton ghost"><span class="icon">📚</span><span>Прайс-лист</span></button>
      </div>
      <details class="toolMenu">
        <summary aria-label="Дополнительно">⋯</summary>
        <div class="menuSheet">
          <button id="btnSaveTKP" class="toolButton ghost"><span class="icon">💾</span><span>Скачать ТКП (HTML)</span></button>
          <button id="importPrice" class="toolButton ghost"><span class="icon">📥</span><span>Импорт прайса</span></button>
          <button id="btnClear" class="toolButton ghost danger"><span class="icon">🗑️</span><span>Очистить</span></button>
        </div>
      </details>
    </div>

    <table id="items">
      <thead>
        <tr>
          <th style="width:32px">#</th>
          <th>Наименование</th>
          <th style="width:90px">Ед.</th>
          <th style="width:120px">Тип</th>
          <th class="priceCol">Цена</th>     <!-- было фикс шириной -->
          <th style="width:120px">Кол-во</th>
          <th>Сумма</th>
          <th style="width:40px"></th>
          <th class="moreCol" style="width:1px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="row wrap stack-sm">
      <textarea id="note" class="note grow" placeholder="Примечание для ТКП (появится в самом конце, например: «Для начала работ требуется предоплата на закупку материалов…»)"></textarea>
    </div>
  </div>

  <!-- Итоги -->
  <div class="card grid">
    <h2>Итоги</h2>
    <div class="totals">
      <div class="block">
        <div class="line"><span>Работы</span><b id="laborSum">0</b></div>
        <div class="line"><span>Материалы</span><b id="matSum">0</b></div>
        <div class="row wrap stack-sm" style="margin-top:8px">
          <input id="laborDiscount" placeholder="Скидка на работы, %" style="max-width:200px" inputmode="decimal">
          <input id="matMarkup" placeholder="Наценка на материалы, %" style="max-width:200px" inputmode="decimal">
          <input id="matDiscount" placeholder="Скидка на материалы, %" style="max-width:200px" inputmode="decimal">
          <input id="vat" placeholder="НДС/VAT, %" style="max-width:140px" inputmode="decimal">
        </div>
      </div>
      <div class="block">
        <div class="line"><span>Итого (до НДС)</span><b id="subtotal">0</b></div>
        <div class="line"><span>Итого к оплате</span><b id="grand">0</b></div>
      </div>
    </div>
  </div>

  <!-- Модалка прайса -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHeader">
        <div class="grow">
          <div id="modalTitle" style="font-weight:700">Прайс</div>
          <div class="muted" id="modalSub">Выберите категорию</div>
        </div>
        <button class="x" id="closeModal" aria-label="Закрыть">×</button>
      </div>
      <div class="modalBody">
        <div id="catRow">
          <div class="chipRow" id="catChips"></div>
          <div id="catGrid"></div>
        </div>
        <div id="pickRow" style="display:none">
          <div class="stickySearch">
            <div class="row wrap stack-sm">
              <button id="backToCats" class="ghost btn-sm">← Категории</button>
              <input id="search" class="grow" placeholder="Поиск…" />
              <select id="filterType" style="max-width:160px">
                <option value="">Все типы</option>
                <option>Работа</option>
                <option>Материал</option>
              </select>
              <button id="selectAll" class="ghost btn-sm">Выбрать все</button>
              <button id="clearAll" class="ghost btn-sm">Снять все</button>
              <span class="pill" id="pickCount">Выбрано: 0</span>
            </div>
            <div class="chipRow" id="catChipsInline"></div>
          </div>
          <div class="list" id="priceList"></div>
        </div>
      </div>
      <div class="modalFooter">
        <button id="addSelected" class="primary">Добавить выбранные</button>
        <button id="closeModal2" class="ghost">Закрыть</button>
      </div>
    </div>
  </div>
</div>
<div class="totalsBar" id="totalsBar" aria-live="polite">
  <div class="totalsBarTotal"><span>Итого</span><div id="totalsBarGrand">0 ₽</div></div>
  <div class="totalsBarActions">
    <button id="totalsAdd" class="toolButton primary"><span class="icon">＋</span><span>Позиция</span></button>
    <button id="totalsTKP" class="toolButton ghost"><span class="icon">📄</span><span>ТКП / PDF</span></button>
  </div>
</div>

<script>
(function(){ 'use strict';
  /* ===== helpers ===== */
  var $  = function(sel){ return document.querySelector(sel) };
  var $$ = function(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)) };
  var LS_KEY='electro_estimate_v1';
  var LS_PRICE='electro_price_list_2025_02';

  /* ===== ПРАЙС (из вашего списка) ===== */
  var priceList = [
    /* 1 Штробление */
    ["1. Штробление, заделка","Штробление стен под проводку. (гипс)","м.п.",280,"Работа"],
    ["1. Штробление, заделка","Штробление стен под проводку. (кирпич)","м.п.",350,"Работа"],
    ["1. Штробление, заделка","Штробление стен под проводку. (бетон)","м.п.",430,"Работа"],
    ["1. Штробление, заделка","Штробление стен под подразетник (гипс)","шт.",350,"Работа"],
    ["1. Штробление, заделка","Штробление стен под подразетник (кирпич)","шт.",400,"Работа"],
    ["1. Штробление, заделка","Штробление стен под подразетник (бетон)","шт.",500,"Работа"],
    ["1. Штробление, заделка","Штробление стен под распаячную коробку (гипс)","шт.",450,"Работа"],
    ["1. Штробление, заделка","Штробление стен под распаячную коробку (кирпич)","шт.",550,"Работа"],

  function fmt(n){
    var cur = ($('#currency').value||'₽').trim() || '₽';
    var num = Number(n||0);
    var formatted = new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(num);
    return formatted+'\u00A0'+cur;
  }
  function updateTotalsBar(total){
    var bar=document.getElementById('totalsBar');
    var target=document.getElementById('totalsBarGrand');
    if(!bar || !target) return;
    target.textContent=fmt(total);

      bar.classList.add('show');

  function cleanupNumber(x){ if(x==null) return 0; var s=(''+x).replace(/[\s\u00A0]/g,'').replace(',', '.').replace(/[^0-9.\-]/g,''); var v=parseFloat(s); return isNaN(v)?0:v; }

  function addRow(it){
    it=it||{};
    var tr=document.createElement('tr');
    tr.className='itemCard';
    tr.innerHTML =
      '<td class="idx idxCell" data-label="№"></td>'+
      '<td class="nameCell cell-full" data-label="Наименование"><input class="name" placeholder="Наименование" value="'+(it.name||'')+'"></td>'+
      '<td class="unitCell" data-label="Ед."><input class="unit" placeholder="ед." value="'+(it.unit||'')+'"></td>'+
      '<td class="typeCell" data-label="Тип">'+
        '<select class="type">'+
          '<option '+(it.type==='Работа'?'selected':'')+'>Работа</option>'+
          '<option '+(it.type==='Материал'?'selected':'')+'>Материал</option>'+
        '</select>'+
      '</td>'+
      '<td class="priceCell" data-label="Цена"><input class="price right" type="number" inputmode="decimal" step="0.01" min="0" value="'+(it.price||0)+'"></td>'+
      '<td class="qtyCell" data-label="Кол-во">'+
        '<div class="qtyControl">'+
          '<button type="button" class="qtyBtn minus" aria-label="Уменьшить количество">−</button>'+
          '<input class="qty right" type="number" inputmode="decimal" step="1" min="0" value="'+(it.qty||1)+'">'+
          '<button type="button" class="qtyBtn plus" aria-label="Увеличить количество">+</button>'+
        '</div>'+
      '</td>'+
      '<td class="sumCell right cell-full" data-label="Сумма">0 ₽</td>'+
      '<td class="actionsCell right" data-label=""><button class="danger del" aria-label="Удалить позицию">×</button></td>'+
      '<td class="moreCell cell-full" data-label=""><button type="button" class="itemCardToggle" aria-expanded="false"><span class="toggleText">Подробнее</span><span class="toggleIcon" aria-hidden="true">▾</span></button></td>';
    tbody.appendChild(tr);
    tr.querySelectorAll('input,select').forEach(function(el){ el.addEventListener('input', function(){ calc(); saveState(); }); });
    tr.querySelector('.del').addEventListener('click', function(){ tr.remove(); renumber(); calc(); saveState(); });
    var qtyInput = tr.querySelector('.qty');
    function adjust(delta){
      var current = cleanupNumber(qtyInput.value);
      var next = current + delta;
      if(next < 0) next = 0;
      qtyInput.value = (Math.round(next*100)/100).toString();
      qtyInput.dispatchEvent(new Event('input',{bubbles:true}));
    }
    tr.querySelector('.qtyBtn.minus').addEventListener('click', function(){ adjust(-1); });
    tr.querySelector('.qtyBtn.plus').addEventListener('click', function(){ adjust(1); });
    var toggleBtn = tr.querySelector('.itemCardToggle');
    toggleBtn.addEventListener('click', function(){
      var expanded = tr.classList.toggle('expanded');
      toggleBtn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
      toggleBtn.querySelector('.toggleText').textContent = expanded ? 'Скрыть' : 'Подробнее';
      toggleBtn.querySelector('.toggleIcon').textContent = expanded ? '▴' : '▾';
    });
    renumber(); calc(); saveState();
  }
  function renumber(){ $$('#tbody .idx').forEach(function(c,i){ c.textContent=i+1 }) }
  function getRows(){ return $$('#tbody tr').map(function(tr){ return {
    name: tr.querySelector('.name').value.trim(),
    unit: tr.querySelector('.unit').value.trim(),
    type: tr.querySelector('.type').value,
    price: cleanupNumber(tr.querySelector('.price').value),
    qty: cleanupNumber(tr.querySelector('.qty').value)
  } }) }

  function calc(){
    var labor=0, mat=0;
    $$('#tbody tr').forEach(function(tr){
      var price=cleanupNumber(tr.querySelector('.price').value);
      var qty=cleanupNumber(tr.querySelector('.qty').value);
      var type=tr.querySelector('.type').value;
      var sum=price*qty;
      tr.querySelector('.sumCell').textContent=fmt(sum);
      if(type==='Материал') mat+=sum; else labor+=sum;
    });
    $('#laborSum').textContent=fmt(labor);
    $('#matSum').textContent=fmt(mat);

    var laborDisc = cleanupNumber($('#laborDiscount').value)/100;
    var markup    = cleanupNumber($('#matMarkup').value)/100;
    var matDisc   = cleanupNumber($('#matDiscount').value)/100;
    var vat       = cleanupNumber($('#vat').value)/100;

    var laborAfter   = labor * (1 - laborDisc);
    var matWithMk    = mat * (1 + markup);
    var matAfter     = matWithMk * (1 - matDisc);

    var subtotal = laborAfter + matAfter;      // до НДС
    var withVat  = subtotal * (1 + vat);       // финал

    $('#subtotal').textContent = fmt(subtotal);
    $('#grand').textContent    = fmt(withVat);
    updateTotalsBar(withVat);
  }

    [catChips, catChipsInline].forEach(function(container){
      if(!container) return;
      container.innerHTML='';
      categories.forEach(function(cat){
        var chip=document.createElement('button');
        chip.type='button';
        chip.className='chip';
        chip.setAttribute('data-cat', cat);
        chip.textContent=cat;
        chip.addEventListener('click', function(){ enterCategory(cat); });
        container.appendChild(chip);
      });
    });
    highlightChips(currentCat);
  }
  function showCategories(){
    currentCat=''; catGrid.innerHTML='';
    var categories=buildCategories();
    renderCategoryChips(categories);
    categories.forEach(function(cat){
      var el=document.createElement('div'); el.className='catCard';
      var count=priceList.filter(function(x){return x.category===cat}).length;
      el.innerHTML='<div class="catIcon">'+categoryIcon(cat)+'</div><div><div style="font-weight:700">'+cat+'</div><div class="muted">'+count+' поз.</div></div>';
      el.addEventListener('click', function(){ enterCategory(cat); });
      catGrid.appendChild(el);
    });
    highlightChips(currentCat);
    $('#modalSub').textContent='Выберите категорию';
    catRow.style.display='block'; pickRow.style.display='none';
  }
  document.getElementById('backToCats').addEventListener('click', showCategories);

  function renderPriceList(){
    var q=($('#search').value||'').toLowerCase(); var t=$('#filterType').value;
    highlightChips(currentCat);
    var list = priceList.map(function(it,idx){ return {it:it, idx:idx}; }).filter(function(row){
      var x=row.it; var byCat=!currentCat || (x.category===currentCat); var byType=!t || x.type===t; var byQuery=(x.name||'').toLowerCase().indexOf(q)>-1; return byCat&&byType&&byQuery;
    });
    priceListEl.innerHTML='';
    list.forEach(function(row){
      var x=row.it; var i=row.idx;
      var el=document.createElement('div'); el.className='item';
      el.innerHTML=
        '<input type="checkbox" class="pick" data-idx="'+i+'"/>'+
        '<div class="grow">'+
          '<div>'+x.name+'</div>'+
          '<div class="muted" style="font-size:12px">'+x.type+' • ед.: '+x.unit+' • цена: <span class="itemPrice">'+fmt(x.price)+'</span></div>'+
        '</div>'+
        '<div class="row" style="gap:6px">'+
          '<input type="number" inputmode="decimal" min="0" step="0.01" value="'+x.price+'" class="priceEdit">'+
          '<button class="primary add btn-sm">Добавить</button>'+
        '</div>';
      var priceEdit=el.querySelector('.priceEdit');
      var priceLabel=el.querySelector('.itemPrice');
      priceEdit.addEventListener('input', function(){ x.price=cleanupNumber(priceEdit.value); priceEdit.value=x.price; priceLabel.textContent=fmt(x.price); savePrice(); });
      el.querySelector('.add').addEventListener('click', function(ev){ ev.stopPropagation(); addRow({name:x.name,unit:x.unit,type:x.type,price:x.price,qty:1}); });
      el.addEventListener('click', function(ev){ var tag=(ev.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='button') return; var ch=el.querySelector('.pick'); ch.checked=!ch.checked; updatePickCount(); });
      el.querySelector('.pick').addEventListener('change', updatePickCount);
      priceListEl.appendChild(el);
    });
    updatePickCount();
  }
  document.getElementById('search').addEventListener('input', renderPriceList);
  document.getElementById('filterType').addEventListener('change', renderPriceList);
  document.getElementById('selectAll').addEventListener('click', function(){ $$('#priceList .pick').forEach(function(ch){ ch.checked=true }); updatePickCount(); });
  document.getElementById('clearAll').addEventListener('click', function(){ $$('#priceList .pick').forEach(function(ch){ ch.checked=false }); updatePickCount(); });
  function updatePickCount(){ var count=$$('#priceList .pick:checked').length; $('#pickCount').textContent='Выбрано: '+count; $('#addSelected').textContent=count?('Добавить выбранные ('+count+')'):'Добавить выбранные' }

  document.getElementById('addSelected').addEventListener('click', function(){
    var picks = Array.prototype.slice.call(priceListEl.querySelectorAll('.pick:checked'));
    if(!picks.length){ closeModal(); return; }
    picks.forEach(function(ch){
      var idx=parseInt(ch.getAttribute('data-idx')||'-1',10);
      if(isNaN(idx)||idx<0||idx>=priceList.length) return;
      var x=priceList[idx];
      addRow({name:x.name, unit:x.unit, type:x.type, price:x.price, qty:1});
    });
    closeModal();
  });

  /* ===== Импорт материалов из XLS/XLSX/CSV (B,E,F,G начиная с 3 строки) ===== */
  function importMaterialsFromWorkbook(wb){
    var sheetName = wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
    if(!rows || rows.length<3){ alert('Не нашёл данные в листе.'); return; }
    for(var r=2;r<rows.length;r++){
      var row = rows[r]||[];
      var name = (row[1]||'').toString().trim(); // B
      var qty  = cleanupNumber(row[4]);          // E
      var price= cleanupNumber(row[5]);          // F
      var sum  = cleanupNumber(row[6]);          // G
      if(!name || qty<=0) continue;
      if((!price || price==0) && (sum>0 && qty>0)){ price = sum/qty; }
      addRow({name:name, unit:'', type:'Материал', price:(price || 0), qty:(qty || 1)});
    }
    calc(); saveState();
    alert('Материалы импортированы.');
  }

  document.getElementById('importMaterials').addEventListener('click', function(){
    var input=document.createElement('input');
    input.type='file'; input.accept='.xls,.xlsx,.csv';
    input.onchange=function(e){
      var file=e.target.files[0]; if(!file) return;
      var ext = (file.name.split('.').pop()||'').toLowerCase();
      var reader = new FileReader();
      if(window.XLSX){
        reader.onload = function(ev){
          var data = ev.target.result;
          var wb = XLSX.read(data, {type:'array'});
          importMaterialsFromWorkbook(wb);
        };
        reader.readAsArrayBuffer(file);
      }else{
        if(ext==='csv'){
          reader.onload=function(ev){
            var text = ev.target.result||'';
            var lines = text.split(/\r?\n/);
            for(var r=2;r<lines.length;r++){
              var cells = lines[r].split(';');
              if(cells.length<7) cells = lines[r].split(',');
              var name = (cells[1]||'').trim();
              var qty  = cleanupNumber(cells[4]);
              var price= cleanupNumber(cells[5]);
              var sum  = cleanupNumber(cells[6]);
              if(!name || qty<=0) continue;
              if((!price || price==0) && sum>0 && qty>0){ price = sum/qty; }
              addRow({name:name, unit:'', type:'Материал', price:(price||0), qty:(qty||1)});
            }
            calc(); saveState();
            alert('Материалы импортированы из CSV.');
          };
          reader.readAsText(file,'utf-8');
        }else{
          alert('Для .xls/.xlsx нужен интернет, чтобы загрузить модуль XLSX. Либо сохраните корзину как CSV.');
        }
      }
    };
    input.click();
  });

  /* ===== ТКП ===== */
function buildTKPHtml(d, rows, sums){

    + '<div>Клиент: <b>'+(d.client||'')+'</b>'+(d.clientPhone?(' • Телефон: <b>'+d.clientPhone+'</b>'):'')+' • Объект: <b>'+(d.site||'')+'</b></div>'
    + '</div><div><div class="badge">Исполнитель</div><div style="margin-top:6px"><b>'+(d.pro.name||'Станислав')
    + '</b><br><a href="'+(tel?('tel:+'+tel):'#')+'">'+(d.pro.phone||'+7 919 809 45 88')+'</a></div></div></div><br>';

  var visibleRows = rows.filter(function(r){ return r.qty>0 && r.price>=0; });

  var tableRows = visibleRows.map(function(r){

      + '<td class="num">'+r.i+'</td>'
      + '<td class="name">'+r.name+'</td>'
      + '<td class="unit">'+(r.unit||'')+'</td>'
      + '<td class="qty">'+r.qty+'</td>'
      + '<td class="price">'+r.price.toFixed(2)+'&nbsp;'+cur+'</td>'
      + '<td class="sum">'+r.sum.toFixed(2)+'&nbsp;'+cur+'</td>'
      + '</tr>';
  }).join('');

  var table = '<table>'
    + '<colgroup>'
    +   '<col style="width:44px">'
    +   '<col>'                      /* Наименование — тянется и переносится */
    +   '<col style="width:72px">'
    +   '<col style="width:86px">'
    +   '<col style="width:150px">'  /* Цена — шире, без переноса */
    +   '<col style="width:180px">'  /* Сумма — шире, без переноса */
    + '</colgroup>'
    + '<thead><tr>'
    +   '<th class="num">#</th>'
    +   '<th class="name">Наименование</th>'
    +   '<th class="unit">Ед.</th>'
    +   '<th class="qty">Кол-во</th>'
    +   '<th class="price">Цена</th>'
    +   '<th class="sum">Сумма</th>'
    + '</tr></thead><tbody>'+tableRows+'</tbody></table>';

  var footer = '<br><table style="width:auto;border-collapse:collapse">'
    + '<tr><td style="border:1px solid #ccc;padding:6px">Работы</td><td style="border:1px solid #ccc;padding:6px;white-space:nowrap;text-align:right">'
    + sums.labor.toFixed(2)+'&nbsp;'+cur+'</td></tr>';

  if(sums.laborDiscount>0){
    footer += '<tr><td style="border:1px solid #ccc;padding:6px">Скидка на работы</td>'
      + '<td style="border:1px solid #ccc;padding:6px;white-space:nowrap;text-align:right">- '
      + sums.laborDiscountAmount.toFixed(2)+'&nbsp;'+cur+' ('+(sums.laborDiscount*100).toFixed(0)+'%)</td></tr>';
  }

  footer += '<tr><td style="border:1px solid #ccc;padding:6px">Материалы</td><td style="border:1px solid #ccc;padding:6px;white-space:nowrap;text-align:right">'

  if(sums.markup>0){

      + '<td style="border:1px solid #ccc;padding:6px;white-space:nowrap;text-align:right">'
      + sums.matMarkupAmount.toFixed(2)+'&nbsp;'+cur+' ('+(sums.markup*100).toFixed(0)+'%)</td></tr>';

  footer += '<tr><th style="border:1px solid #ccc;padding:6px">Итого к оплате</th>'

  return head + hdr + table + footer + '</body></html>';
}

  function computeTKPSums(rows){
    var labor=0, mat=0;
    rows.forEach(function(r){ if(r.type==='Материал') mat+=r.sum; else labor+=r.sum; });

    var laborDiscount = cleanupNumber($('#laborDiscount').value)/100;
    var markup        = cleanupNumber($('#matMarkup').value)/100;
    var matDiscount   = cleanupNumber($('#matDiscount').value)/100;
    var vat           = cleanupNumber($('#vat').value)/100;

    var laborAfter         = labor * (1 - laborDiscount);
    var laborDiscountAmount= labor - laborAfter;

    var matWithMarkup      = mat * (1 + markup);
    var matMarkupAmount    = matWithMarkup - mat;

    var matAfterMatDisc    = matWithMarkup * (1 - matDiscount);
    var matDiscountAmount  = matWithMarkup - matAfterMatDisc;

    var subtotal = laborAfter + matAfterMatDisc; // до НДС

    var withVat  = subtotal * (1 + vat);
    var vatAmount= withVat - subtotal;

    return {
      labor: labor, laborDiscount: laborDiscount, laborDiscountAmount: laborDiscountAmount,
      mat: mat, markup: markup, matMarkupAmount: matMarkupAmount,
      matDiscount: matDiscount, matDiscountAmount: matDiscountAmount,
      subtotal: subtotal, vat: vat, vatAmount: vatAmount, withVat: withVat
    };
  }

  function getRowsForTKP(){
    var d=collect();
    var rows=d.items.map(function(it,i){ return {i:i+1,name:it.name,unit:it.unit||'',qty:it.qty||0,price:it.price||0,sum:(it.qty||0)*(it.price||0),type:it.type} });
    return {d:d, rows:rows, sums:computeTKPSums(rows)};
  }

  function openTKPWindow(){
    var data=getRowsForTKP();
    var html=buildTKPHtml(data.d, data.rows, data.sums);
    var w=window.open('','_blank'); if(!w){ alert('Разрешите всплывающие окна для ТКП'); return; }
    w.document.write(html); w.document.close(); w.focus(); w.print();
  }

  function downloadTKP(){
    var data=getRowsForTKP();
    var html=buildTKPHtml(data.d, data.rows, data.sums);
    var blob=new Blob([html], {type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var cleanClient=(data.d.client||'TKP').replace(/[^\w\u0400-\u04FF]+/g,'_');
    a.download='TKP_'+cleanClient+'.html';
    a.href=url; a.click(); URL.revokeObjectURL(url);
  }

  /* Кнопки */
  document.addEventListener('click', function(e){
    var t=e.target;
    if(t.closest('#addRow') || t.closest('#totalsAdd')){ addRow({qty:1,type:'Работа'}); renumber(); calc(); saveState(); }
    if(t.closest('#btnTKP') || t.closest('#totalsTKP')) openTKPWindow();
    if(t.closest('#btnSaveTKP')) downloadTKP();
    if(t.closest('#btnPrintAll')) window.print();
    if(t.closest('#btnClear')){ if(confirm('Очистить смету?')){ localStorage.removeItem(LS_KEY); location.reload(); } }
    if(t.closest('#exportPrice')){
      var blob=new Blob([JSON.stringify(priceList,null,2)],{type:'application/json'});
      var url=URL.createObjectURL(blob); var a=document.createElement('a');
      a.href=url; a.download='electro_price_2025.json'; a.click(); URL.revokeObjectURL(url);
    }
    if(t.closest('#importPrice')){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
      inp.onchange=function(ev){ var file=ev.target.files[0]; if(!file) return; var reader=new FileReader();
        reader.onload=function(){ try{ priceList=JSON.parse(reader.result); savePrice(); alert('Прайс импортирован.'); }catch(err){ alert('Ошибка импорта: '+err.message) } };
        reader.readAsText(file);
      }; inp.click();
    }
    var menu = t.closest('.toolMenu');
    if(menu && t.closest('.menuSheet button')){ menu.removeAttribute('open'); }
  });

  ['client','clientPhone','site','date','estimateNo','validDays','currency','note','laborDiscount','matMarkup','matDiscount','vat'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener('input', function(){ calc(); saveState(); });
  });

  window.addEventListener('resize', function(){ updateTotalsBar(cleanupNumber($('#grand').textContent)); });

  restore();
})();
