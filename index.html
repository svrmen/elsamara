<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ЭлектроСмета — Станислав</title>
<!-- Библиотека для чтения xls/xlsx (работает при наличии интернета) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f9fc;--card:#ffffff;--muted:#606979;--ink:#0f172a;--accent:#2563eb;
  --danger:#dc2626;--line:#e6e9ef;--chip:#eef2ff
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.46 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
h1{font-size:22px;margin:0 0 2px}
h2{font-size:16px;margin:0 0 8px;color:var(--muted)}
input,select,textarea{background:#fff;border:1px solid #d6dbe6;color:var(--ink);border-radius:10px;padding:10px;outline:none;width:100%}
button{background:#fff;border:1px solid #cfd6e3;color:#0f172a;border-radius:10px;padding:8px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:transparent;color:#fff;font-weight:600}
button.ghost{background:#fff;border-color:#d1d5db}
button.danger{background:#fff;border-color:#f4c7c7;color:#b91c1c}
.btn-sm{padding:6px 8px;border-radius:8px;font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;background:var(--chip);border:1px solid #dbe3ff;border-radius:999px;font-weight:600}
.avatar{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;background:linear-gradient(135deg,#dbeafe,#ede9fe);border:1px solid #c7d2fe;color:#1e293b}
.divider{height:1px;background:var(--line);margin:8px 0}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:middle}
.right{text-align:right}
.pill{font-size:12px;border:1px solid #cfd6e3;padding:2px 8px;border-radius:999px;color:var(--muted);background:#fff}

/* Модалка */
.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.backdrop.show{display:flex}
.modal{background:#fff;border-radius:16px;border:1px solid #d9e1ef;max-width:980px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modalHeader{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid #eef2f8}
.modalBody{display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px}
.modalFooter{display:flex;gap:8px;justify-content:flex-end;padding:10px;border-top:1px solid #eef2f8;background:#fafcff}
.x{border:none;background:transparent;font-size:22px;line-height:1;padding:6px 8px;cursor:pointer}
#catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.catCard{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;cursor:pointer;display:grid;gap:6px;grid-template-columns:auto 1fr;align-items:center}
.catIcon{font-size:20px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:#f2f6ff;border-radius:10px}
.list{height:48vh;overflow:auto;border:1px dashed #d7deea;border-radius:12px;padding:2px;background:#fff}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px}
.item:hover{background:#f3f6fb}
.priceEdit{width:88px}
.note{min-height:74px}
a.tel{color:inherit;text-decoration:none}

/* Итоги */
.totals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.block{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.line{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.line:last-child{border-bottom:none}

/* === MOBILE PATCH === */
@media (max-width: 740px){
  .wrap{padding:10px}
  h1{font-size:18px}
  .card{padding:12px}
  .row{gap:6px}
  input,select,textarea,button{min-height:44px;font-size:16px}
  button.btn-sm{min-height:38px}
  input[type="checkbox"]{width:20px;height:20px}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  thead, tbody{min-width:760px}
  .modal{width:100%;max-width:none;height:96vh;max-height:96vh;border-radius:12px}
  .modalBody{grid-template-rows:auto 1fr}
  .list{height:calc(96vh - 210px)}
  .item{grid-template-columns:24px 1fr auto}
  .priceEdit{width:78px}
  .totals{grid-template-columns:1fr}
  .card.grid:last-of-type{position:sticky;bottom:0;z-index:5;background:#fff;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
}
</style>
</head>

<div class="wrap grid" id="app">

    </div>

    <div class="row wrap">

    </div>
  </div>

  <!-- Таблица позиций -->

        <button id="exportPrice">Экспорт прайса</button>

    </div>

    <table id="items">
      <thead>
        <tr>

          <th>Наименование</th>
          <th style="width:90px">Ед.</th>
          <th style="width:120px">Тип</th>
          <th class="priceCol">Цена</th>     <!-- было фикс шириной -->
          <th style="width:120px">Кол-во</th>
          <th>Сумма</th>
          <th style="width:40px"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="row wrap">
      <textarea id="note" class="note grow" placeholder="Примечание для ТКП (появится в самом конце, например: «Для начала работ требуется предоплата на закупку материалов…»)"></textarea>
    </div>
  </div>

  <!-- Итоги -->
  <div class="card grid">
    <h2>Итоги</h2>
    <div class="totals">
      <div class="block">
        <div class="line"><span>Работы</span><b id="laborSum">0</b></div>
        <div class="line"><span>Материалы</span><b id="matSum">0</b></div>
        <div class="row wrap" style="margin-top:8px">
          <input id="laborDiscount" placeholder="Скидка на работы, %" style="max-width:200px">
          <input id="matMarkup" placeholder="Наценка на материалы, %" style="max-width:200px">
          <input id="matDiscount" placeholder="Скидка на материалы, %" style="max-width:200px">
          <input id="vat" placeholder="НДС/VAT, %" style="max-width:140px">
        </div>
      </div>
      <div class="block">
        <div class="line"><span>Итого (до НДС)</span><b id="subtotal">0</b></div>
        <div class="line"><span>Итого к оплате</span><b id="grand">0</b></div>
      </div>
    </div>
  </div>

  <!-- Модалка прайса -->
  <div class="backdrop" id="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modalHeader">
        <div class="grow">

          <div class="muted" id="modalSub">Выберите категорию</div>
        </div>
        <button class="x" id="closeModal" aria-label="Закрыть">×</button>
      </div>
      <div class="modalBody">
        <div id="catRow">
          <div id="catGrid"></div>
        </div>
        <div id="pickRow" style="display:none">
          <div class="row wrap">
            <button id="backToCats" class="ghost btn-sm">← Категории</button>
            <input id="search" class="grow" placeholder="Поиск…" />
            <select id="filterType" style="max-width:160px">
              <option value="">Все типы</option>
              <option>Работа</option>
              <option>Материал</option>
            </select>
            <button id="selectAll" class="ghost btn-sm">Выбрать все</button>

            <span class="pill" id="pickCount">Выбрано: 0</span>
          </div>
          <div class="list" id="priceList"></div>
        </div>
      </div>
      <div class="modalFooter">
        <button id="addSelected" class="primary">Добавить выбранные</button>
        <button id="closeModal2" class="ghost">Закрыть</button>
      </div>
    </div>
  </div>
</div>

  /* ===== Таблица сметы ===== */
  var tbody=$('#tbody');
  function fmt(n){ var cur=$('#currency').value||'р.'; var num=Number(n||0); return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(num)+' '+cur }
  function cleanupNumber(x){ if(x==null) return 0; var s=(''+x).replace(/[\s\u00A0]/g,'').replace(',', '.').replace(/[^0-9.\-]/g,''); var v=parseFloat(s); return isNaN(v)?0:v; }

  function addRow(it){
    it=it||{};
    var tr=document.createElement('tr');
    tr.innerHTML =
      '<td class="idx"></td>'+
      '<td><input class="name" placeholder="Наименование" value="'+(it.name||'')+'"></td>'+

        '</select>'+
      '</td>'+
      '<td style="max-width:140px"><input class="price right" type="number" inputmode="decimal" step="0.01" min="0" value="'+(it.price||0)+'"></td>'+
      '<td style="max-width:120px"><input class="qty right" type="number" inputmode="decimal" step="0.01" min="0" value="'+(it.qty||1)+'"></td>'+

    tbody.appendChild(tr);
    tr.querySelectorAll('input,select').forEach(function(el){ el.addEventListener('input', function(){ calc(); saveState(); }); });
    tr.querySelector('.del').addEventListener('click', function(){ tr.remove(); renumber(); calc(); saveState(); });
    renumber(); calc(); saveState();
  }
  function renumber(){ $$('#tbody .idx').forEach(function(c,i){ c.textContent=i+1 }) }
  function getRows(){ return $$('#tbody tr').map(function(tr){ return {
    name: tr.querySelector('.name').value.trim(),
    unit: tr.querySelector('.unit').value.trim(),
    type: tr.querySelector('.type').value,
    price: parseFloat(tr.querySelector('.price').value||0),
    qty: parseFloat(tr.querySelector('.qty').value||0)
  } }) }

  function calc(){
    var labor=0, mat=0;
    $$('#tbody tr').forEach(function(tr){
      var price=parseFloat(tr.querySelector('.price').value||0);
      var qty=parseFloat(tr.querySelector('.qty').value||0);
      var type=tr.querySelector('.type').value;
      var sum=price*qty;
      tr.querySelector('.sumCell').textContent=fmt(sum);
      if(type==='Материал') mat+=sum; else labor+=sum;
    });
    $('#laborSum').textContent=fmt(labor);
    $('#matSum').textContent=fmt(mat);

    var laborDisc = (parseFloat(($('#laborDiscount').value||'').trim()||'0')/100) || 0;
    var markup    = (parseFloat(($('#matMarkup').value||'').trim()||'0')/100) || 0;
    var matDisc   = (parseFloat(($('#matDiscount').value||'').trim()||'0')/100) || 0;
    var vat       = (parseFloat(($('#vat').value||'').trim()||'0')/100) || 0;

    var laborAfter   = labor * (1 - laborDisc);
    var matWithMk    = mat * (1 + markup);
    var matAfter     = matWithMk * (1 - matDisc);

    var subtotal = laborAfter + matAfter;      // до НДС
    var withVat  = subtotal * (1 + vat);       // финал

    $('#subtotal').textContent = fmt(subtotal);
    $('#grand').textContent    = fmt(withVat);
  }

  function collect(){ return {

    pro: { name: $('#proName').value || 'Станислав', phone: $('#proPhone').value || '+7 919 809 45 88' }
  }}

  function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(collect())); }catch(e){} }

    calc();

  /* ===== Модалка прайса ===== */

  function openModal(){ bd.classList.add('show'); document.body.style.overflow='hidden'; showCategories(); $('#modalTitle').textContent='Прайс'; $('#modalSub').textContent='Выберите категорию'; }

  function categoryIcon(cat){ var n = (cat.match(/^\d+/)||[''])[0]; return ({'1':'⛏️','2':'🔌','3':'💡','4':'⚙️','5':'🧰','6':'✨','7':'📡'}[n]) || '📦'; }
  function buildCategories(){
    var map={}; priceList.forEach(function(it){ map[it.category]=(map[it.category]||0)+1; });
    return Object.keys(map).sort(function(a,b){ var na=parseInt((a.match(/^\d+/)||['0'])[0]); var nb=parseInt((b.match(/^\d+/)||['0'])[0]); if(na!=nb) return na-nb; return a.localeCompare(b,'ru'); });
  }
  function showCategories(){
    currentCat=''; catGrid.innerHTML='';
    buildCategories().forEach(function(cat){
      var el=document.createElement('div'); el.className='catCard';
      var count=priceList.filter(function(x){return x.category===cat}).length;
      el.innerHTML='<div class="catIcon">'+categoryIcon(cat)+'</div><div><div style="font-weight:700">'+cat+'</div><div class="muted">'+count+' поз.</div></div>';
      el.addEventListener('click', function(){ currentCat=cat; catRow.style.display='none'; pickRow.style.display='block'; $('#modalSub').textContent=cat; renderPriceList(); });

  function renderPriceList(){
    var q=($('#search').value||'').toLowerCase(); var t=$('#filterType').value;
    var list = priceList.map(function(it,idx){ return {it:it, idx:idx}; }).filter(function(row){
      var x=row.it; var byCat=!currentCat || (x.category===currentCat); var byType=!t || x.type===t; var byQuery=(x.name||'').toLowerCase().indexOf(q)>-1; return byCat&&byType&&byQuery;
    });
    priceListEl.innerHTML='';
    list.forEach(function(row){
      var x=row.it; var i=row.idx;
      var el=document.createElement('div'); el.className='item';
      el.innerHTML=

      el.addEventListener('click', function(ev){ var tag=(ev.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='button') return; var ch=el.querySelector('.pick'); ch.checked=!ch.checked; updatePickCount(); });

  /* ===== Импорт материалов из XLS/XLSX/CSV (B,E,F,G начиная с 3 строки) ===== */
  function importMaterialsFromWorkbook(wb){
    var sheetName = wb.SheetNames[0];
    var ws = wb.Sheets[sheetName];
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true});
    if(!rows || rows.length<3){ alert('Не нашёл данные в листе.'); return; }
    for(var r=2;r<rows.length;r++){
      var row = rows[r]||[];
      var name = (row[1]||'').toString().trim(); // B
      var qty  = cleanupNumber(row[4]);          // E
      var price= cleanupNumber(row[5]);          // F
      var sum  = cleanupNumber(row[6]);          // G
      if(!name || qty<=0) continue;
      if((!price || price==0) && (sum>0 && qty>0)){ price = sum/qty; }
      addRow({name:name, unit:'', type:'Материал', price:(price || 0), qty:(qty || 1)});
    }
    calc(); saveState();
    alert('Материалы импортированы.');
  }

  document.getElementById('importMaterials').addEventListener('click', function(){
    var input=document.createElement('input');
    input.type='file'; input.accept='.xls,.xlsx,.csv';
    input.onchange=function(e){
      var file=e.target.files[0]; if(!file) return;
      var ext = (file.name.split('.').pop()||'').toLowerCase();
      var reader = new FileReader();
      if(window.XLSX){
        reader.onload = function(ev){
          var data = ev.target.result;
          var wb = XLSX.read(data, {type:'array'});
          importMaterialsFromWorkbook(wb);
        };
        reader.readAsArrayBuffer(file);
      }else{
        if(ext==='csv'){
          reader.onload=function(ev){
            var text = ev.target.result||'';
            var lines = text.split(/\r?\n/);
            for(var r=2;r<lines.length;r++){
              var cells = lines[r].split(';');
              if(cells.length<7) cells = lines[r].split(',');
              var name = (cells[1]||'').trim();
              var qty  = cleanupNumber(cells[4]);
              var price= cleanupNumber(cells[5]);
              var sum  = cleanupNumber(cells[6]);
              if(!name || qty<=0) continue;
              if((!price || price==0) && sum>0 && qty>0){ price = sum/qty; }
              addRow({name:name, unit:'', type:'Материал', price:(price||0), qty:(qty||1)});
            }
            calc(); saveState();
            alert('Материалы импортированы из CSV.');
          };
          reader.readAsText(file,'utf-8');
        }else{
          alert('Для .xls/.xlsx нужен интернет, чтобы загрузить модуль XLSX. Либо сохраните корзину как CSV.');
        }
      }
    };
    input.click();
  });

  footer += '<tr><th style="border:1px solid #ccc;padding:6px">Итого к оплате</th>'
    + '<th style="border:1px solid #ccc;padding:6px;white-space:nowrap;text-align:right">'
    + sums.withVat.toFixed(2)+'&nbsp;'+cur+'</th></tr></table>';

  if(d.note){
    footer += '<p><b>Примечание:</b><br>'+d.note.replace(/\n/g,'<br>')+'</p>';
  }
  return head + hdr + table + footer + '</body></html>';
}

  function computeTKPSums(rows){
    var labor=0, mat=0;
    rows.forEach(function(r){ if(r.type==='Материал') mat+=r.sum; else labor+=r.sum; });

    var laborDiscount = (parseFloat(($('#laborDiscount').value||'').trim()||'0')/100) || 0;
    var markup        = (parseFloat(($('#matMarkup').value||'').trim()||'0')/100) || 0;
    var matDiscount   = (parseFloat(($('#matDiscount').value||'').trim()||'0')/100) || 0;
    var vat           = (parseFloat(($('#vat').value||'').trim()||'0')/100) || 0;

    var laborAfter         = labor * (1 - laborDiscount);
    var laborDiscountAmount= labor - laborAfter;

    var matWithMarkup      = mat * (1 + markup);
    var matMarkupAmount    = matWithMarkup - mat;

    var matAfterMatDisc    = matWithMarkup * (1 - matDiscount);
    var matDiscountAmount  = matWithMarkup - matAfterMatDisc;

    var subtotal = laborAfter + matAfterMatDisc; // до НДС

    var withVat  = subtotal * (1 + vat);
    var vatAmount= withVat - subtotal;

    return {
      labor: labor, laborDiscount: laborDiscount, laborDiscountAmount: laborDiscountAmount,
      mat: mat, markup: markup, matMarkupAmount: matMarkupAmount,
      matDiscount: matDiscount, matDiscountAmount: matDiscountAmount,
      subtotal: subtotal, vat: vat, vatAmount: vatAmount, withVat: withVat
    };
  }

  function getRowsForTKP(){
    var d=collect();
    var rows=d.items.map(function(it,i){ return {i:i+1,name:it.name,unit:it.unit||'',qty:it.qty||0,price:it.price||0,sum:(it.qty||0)*(it.price||0),type:it.type} });
    return {d:d, rows:rows, sums:computeTKPSums(rows)};
  }

  function openTKPWindow(){
    var data=getRowsForTKP();
    var html=buildTKPHtml(data.d, data.rows, data.sums);
    var w=window.open('','_blank'); if(!w){ alert('Разрешите всплывающие окна для ТКП'); return; }
    w.document.write(html); w.document.close(); w.focus(); w.print();
  }

  function downloadTKP(){
    var data=getRowsForTKP();
    var html=buildTKPHtml(data.d, data.rows, data.sums);
    var blob=new Blob([html], {type:'text/html;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    var cleanClient=(data.d.client||'TKP').replace(/[^\w\u0400-\u04FF]+/g,'_');
    a.download='TKP_'+cleanClient+'.html';
    a.href=url; a.click(); URL.revokeObjectURL(url);
  }

  /* Кнопки */
  document.addEventListener('click', function(e){
    var t=e.target;
    if(t.closest('#addRow')){ addRow({qty:1,type:'Работа'}); renumber(); calc(); saveState(); }
    if(t.closest('#btnTKP')) openTKPWindow();
    if(t.closest('#btnSaveTKP')) downloadTKP();
    if(t.closest('#btnPrintAll')) window.print();
    if(t.closest('#btnClear')){ if(confirm('Очистить смету?')){ localStorage.removeItem(LS_KEY); location.reload(); } }
    if(t.closest('#exportPrice')){
      var blob=new Blob([JSON.stringify(priceList,null,2)],{type:'application/json'});
      var url=URL.createObjectURL(blob); var a=document.createElement('a');
      a.href=url; a.download='electro_price_2025.json'; a.click(); URL.revokeObjectURL(url);
    }
    if(t.closest('#importPrice')){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='application/json';
      inp.onchange=function(ev){ var file=ev.target.files[0]; if(!file) return; var reader=new FileReader();
        reader.onload=function(){ try{ priceList=JSON.parse(reader.result); savePrice(); alert('Прайс импортирован.'); }catch(err){ alert('Ошибка импорта: '+err.message) } };
        reader.readAsText(file);
      }; inp.click();
    }
  });

  ['client','site','date','estimateNo','validDays','currency','note','laborDiscount','matMarkup','matDiscount','vat'].forEach(function(id){
    var el=document.getElementById(id); if(el) el.addEventListener('input', function(){ calc(); saveState(); });
  });

  restore();
})();
</script>
